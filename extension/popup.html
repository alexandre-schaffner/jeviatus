<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev for OpenFront</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <form>
      <header>
        <div>
          <h1>Jev</h1>
          <p>OpenFront strategy engine</p>
        </div>
        <label class="switch" title="Enable Jev">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <label>
        TypeSafe API key
        <input id="apiKey" type="password" autocomplete="off" placeholder="Stored only in this extension" />
      </label>
      <label>
        Model
        <input id="model" type="text" spellcheck="false" />
      </label>
      <div class="pair">
        <label>
          Decision ticks
          <input id="interval" type="number" min="5" max="600" step="1" />
        </label>
        <label>
          Min confidence
          <input id="confidence" type="number" min="0" max="1" step="0.05" />
        </label>
      </div>
      <label>
        Trace URL
        <input id="traceUrl" type="url" spellcheck="false" placeholder="Off · e.g. http://127.0.0.1:9231/trace" />
      </label>
      <label>
        Trace token
        <input id="traceToken" type="password" autocomplete="off" placeholder="Printed by bun run trace-sink" />
      </label>
      <button class="save" type="submit">Save settings</button>
      <p id="status" role="status">Runs on openfront.io and local dev servers.</p>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
